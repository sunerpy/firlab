<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="godot-mcp — an MCP server for Godot projects. Analysis without the engine, journaled edits, and the games and editors it runs.">
  <title>godot-mcp — an MCP server for Godot projects</title>
  <!-- The source of og.png (1200 × 630, rendered in Chrome; godot-mcp/README.md). The colours
       are the site's light theme (theme/styles/tokens.css); the exchange is the home page's: the
       first two calls of its session with the demo game and their real answers. -->

  <!-- Ground -->
  <rect width="1200" height="630" fill="#F3F6FA"/>

  <!-- Accent hairline, top edge: the mark's green as the light theme draws it (--gm-mark), never text -->
  <rect x="0" y="0" width="1200" height="6" fill="#059669"/>

  <!-- The mark (godot-mcp-logo.svg at 60 px) and the name -->
  <g transform="translate(88, 76)">
    <svg width="60" height="60" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#0B1220"/>
      <g transform="translate(8.96 8.96) scale(0.72)">
        <g fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 7C12 7 10 10 10 16V25C10 29 9 32 4 32C9 32 10 35 10 39V48C10 54 12 57 18 57"/>
          <path d="M46 7C52 7 54 10 54 16V25C54 29 55 32 60 32C55 32 54 35 54 39V48C54 54 52 57 46 57"/>
        </g>
        <path fill="#E7EDF5" fill-rule="evenodd" d="M29.5 21h5a1.5 1.5 0 0 1 1.5 1.5V28h5.5a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 1-1.5 1.5H36v5.5a1.5 1.5 0 0 1-1.5 1.5h-5a1.5 1.5 0 0 1-1.5-1.5V36h-5.5a1.5 1.5 0 0 1-1.5-1.5v-5a1.5 1.5 0 0 1 1.5-1.5H28v-5.5a1.5 1.5 0 0 1 1.5-1.5zM34.2 32a2.2 2.2 0 1 0-4.4 0a2.2 2.2 0 1 0 4.4 0z"/>
      </g>
    </svg>
    <text x="80" y="43"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="40" font-weight="650" letter-spacing="-0.6" fill="#0B1220">godot-mcp</text>
  </g>

  <!-- Address line, level with the name -->
  <text x="1112" y="119" text-anchor="end"
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Consolas, monospace"
    font-size="22" fill="#5B6779">firlab.app/godot-mcp</text>

  <!-- Headline: the hero's text; below it what the server does -->
  <text
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="62" font-weight="700" letter-spacing="-1.2" fill="#0B1220">
    <tspan x="84" y="230">An MCP server for</tspan>
    <tspan x="84" y="302">Godot projects</tspan>
  </text>

  <text x="88" y="356"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="26" font-weight="400" fill="#475569">Analysis without the engine, journaled edits, and the games and editors it runs.</text>

  <!-- The first two calls of the home page's exchange with the demo game and their answers, copied
       unchanged from docs/site/index.md (stages.exchange), framed by a hairline -->
  <rect x="88" y="386" width="1024" height="204" rx="12" fill="#FBFCFE"/>
  <rect x="88.5" y="386.5" width="1023" height="203" rx="11.5" fill="none" stroke="#DCE4EE"/>
  <text
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Consolas, monospace"
    font-size="19" fill="#334155" xml:space="preserve" style="font-variant-ligatures: none">
    <tspan x="116" y="424" fill="#0B1220" font-weight="600"><tspan fill="#5B6779" font-weight="400">› </tspan>input.sequence.send</tspan>
    <tspan x="116" y="451" fill="#475569">  action ui_right  press  holdMs 2000</tspan>
    <tspan x="116" y="478" fill="#475569">  wait  ms 2000</tspan>
    <tspan x="116" y="505">steps_run  2</tspan>
    <tspan x="116" y="539" fill="#0B1220" font-weight="600"><tspan fill="#5B6779" font-weight="400">› </tspan>runtime.wait<tspan fill="#475569" font-weight="400">  property score  ==  2</tspan></tspan>
    <tspan x="116" y="566">satisfied  true</tspan>
  </text>
</svg>
