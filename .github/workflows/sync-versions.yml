name: Sync product versions

# Every half hour, and on demand: reads each product's latest stable GitHub release, rewrites the
# constants of src/i18n/versions.ts that drifted (scripts/check-versions.mjs --write), commits that
# one file to main and starts the deploy. The build itself stays offline (DESIGN.md, "Version
# provenance"). User decision 2026-10-07: versions follow the releases without a hand-made pull
# request, and pull requests no longer fail because another repository released.
#
# A push made with GITHUB_TOKEN starts no other workflow, so the deploy is dispatched explicitly.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: product-version-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Update versions.ts from the latest releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Exit 1 is a drift the script will not write (a tag prefix moved) and 2 means GitHub gave no
      # verdict; both fail the run, so the owner hears of it, and nothing is committed.
      - name: Rewrite the drifted constants
        id: sync
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/check-versions.mjs --write 2>&1 | tee sync.log
          echo "subject=$(sed -n 's/^COMMIT_SUBJECT=//p' sync.log)" >> "$GITHUB_OUTPUT"

      - name: Commit to main and deploy
        if: steps.sync.outputs.subject != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT: ${{ steps.sync.outputs.subject }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/i18n/versions.ts
          git commit -m "$SUBJECT"
          # Another push may land first; rebase onto it and try again.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::the version commit could not be pushed after 3 attempts"
              exit 1
            fi
            git pull --rebase origin main
          done
          gh workflow run deploy.yml --ref main
          echo "### ${SUBJECT}" >> "$GITHUB_STEP_SUMMARY"
