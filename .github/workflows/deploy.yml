name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A Pages deploy is not safely interruptible: cancelling one mid-flight can
# leave the live site on a partially published artifact. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages only reads the Pages site config (enablement stays at
      # its default of false, which would require a token other than
      # GITHUB_TOKEN anyway), so read access is enough here.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm has to exist before setup-node, otherwise `cache: pnpm` cannot
      # resolve the store directory and the setup step fails.
      #
      # No `version:` on purpose. action-setup reads the exact version from
      # `packageManager` in package.json, which is also what corepack and the
      # local toolchain read — one pin, one source of truth. Setting `version:`
      # here as well would risk the two disagreeing, which action-setup rejects.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            lockra/pnpm-lock.yaml
            pt-tools/pnpm-lock.yaml
            codegraph/pnpm-lock.yaml
            kiro-provider/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build

      # public/CNAME is the only thing binding this site to the apex domain.
      # If it ever stops reaching dist/, GitHub Pages silently drops the
      # custom domain and firlab.app starts serving 404s. Fail here, loudly,
      # instead of discovering it in production.
      - name: Verify CNAME survived the build
        run: test -f dist/CNAME && grep -qx 'firlab.app' dist/CNAME

      # The Lockra documentation site is published inside this one, under /lockra/
      # (lockra/README.md). It installs and builds on its own, like voltip/ and docs/.
      - name: Install the Lockra site's dependencies
        working-directory: lockra
        run: pnpm install --frozen-lockfile

      - name: Build the Lockra site
        working-directory: lockra
        run: pnpm build

      # Both languages, and every link, asset and sitemap entry under /lockra/.
      - name: Check the Lockra site
        working-directory: lockra
        run: ./scripts/check-dist.sh dist

      # dist/lockra/ belongs to the sub-site alone: if the main site ever emits a page there,
      # stop instead of letting one silently replace the other.
      - name: Add the Lockra site under /lockra/
        run: |
          set -euo pipefail
          if [ -e dist/lockra ]; then
            echo "::error::the main site already emits dist/lockra; the Lockra site would overwrite it"
            exit 1
          fi
          cp -R lockra/dist dist/lockra
          test -f dist/lockra/index.html && test -f dist/lockra/zh/index.html

      # The pt-tools documentation site is published the same way, under /pt-tools/
      # (pt-tools/README.md). It replaced the main site's pt-tools page, so the main site must
      # not emit dist/pt-tools/ any more.
      - name: Install the pt-tools site's dependencies
        working-directory: pt-tools
        run: pnpm install --frozen-lockfile

      - name: Build the pt-tools site
        working-directory: pt-tools
        run: pnpm build

      # Both languages, and every link, asset and sitemap entry under /pt-tools/.
      - name: Check the pt-tools site
        working-directory: pt-tools
        run: ./scripts/check-dist.sh dist

      - name: Add the pt-tools site under /pt-tools/
        run: |
          set -euo pipefail
          if [ -e dist/pt-tools ]; then
            echo "::error::the main site already emits dist/pt-tools; the pt-tools site would overwrite it"
            exit 1
          fi
          cp -R pt-tools/dist dist/pt-tools
          test -f dist/pt-tools/index.html && test -f dist/pt-tools/en/index.html

      # The CodeGraph documentation site is published the same way, under /codegraph/
      # (codegraph/README.md). It replaced the main site's CodeGraph page, so the main site must
      # not emit dist/codegraph/ any more.
      - name: Install the CodeGraph site's dependencies
        working-directory: codegraph
        run: pnpm install --frozen-lockfile

      - name: Build the CodeGraph site
        working-directory: codegraph
        run: pnpm build

      # Both languages, every in-site link resolves, and every link, asset and sitemap entry
      # stays under /codegraph/.
      - name: Check the CodeGraph site
        working-directory: codegraph
        run: ./scripts/check-dist.sh dist

      - name: Add the CodeGraph site under /codegraph/
        run: |
          set -euo pipefail
          if [ -e dist/codegraph ]; then
            echo "::error::the main site already emits dist/codegraph; the CodeGraph site would overwrite it"
            exit 1
          fi
          cp -R codegraph/dist dist/codegraph
          test -f dist/codegraph/index.html && test -f dist/codegraph/en/index.html

      # The kiro-provider documentation site is published the same way, under /kiro-provider/
      # (kiro-provider/README.md). English is its root locale and Chinese sits under /zh/.
      - name: Install the kiro-provider site's dependencies
        working-directory: kiro-provider
        run: pnpm install --frozen-lockfile

      - name: Build the kiro-provider site
        working-directory: kiro-provider
        run: pnpm build

      # Both languages, every in-site link resolves, and every link, asset and sitemap entry
      # stays under /kiro-provider/.
      - name: Check the kiro-provider site
        working-directory: kiro-provider
        run: ./scripts/check-dist.sh dist

      - name: Add the kiro-provider site under /kiro-provider/
        run: |
          set -euo pipefail
          if [ -e dist/kiro-provider ]; then
            echo "::error::the main site already emits dist/kiro-provider; the kiro-provider site would overwrite it"
            exit 1
          fi
          cp -R kiro-provider/dist dist/kiro-provider
          test -f dist/kiro-provider/index.html && test -f dist/kiro-provider/zh/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
