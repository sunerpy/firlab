name: CI

on:
  pull_request:
    branches: [main]

# Superseded pushes to the same PR are worth cancelling; nothing is published
# from here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm has to exist before setup-node, otherwise `cache: pnpm` cannot
      # resolve the store directory and the setup step fails.
      #
      # No `version:` on purpose — see the note in deploy.yml. The version comes
      # from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      # Same guard as the deploy workflow, so a PR that breaks the custom
      # domain fails review instead of failing after merge.
      - name: Verify CNAME survived the build
        run: test -f dist/CNAME && grep -qx 'firlab.app' dist/CNAME
