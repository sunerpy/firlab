name: CodeGraph site CI

# Builds the CodeGraph sub-site on pull requests that touch it, without deploying. The content
# checks (both languages, registered components, word lists) run in codegraph-rust before a sync
# lands here; this catches changes to the site itself: config, theme, components, lockfile,
# and the deploy steps that publish it under /codegraph/.

on:
  pull_request:
    branches: [main]
    paths:
      - 'codegraph/**'
      - '.github/workflows/codegraph-site-ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: codegraph-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the CodeGraph site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: codegraph/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: codegraph/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: codegraph
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: codegraph
        run: pnpm build

      - name: Check both languages, the links and the /codegraph/ base
        working-directory: codegraph
        run: ./scripts/check-dist.sh dist
