name: kiro-provider site CI

# Builds the kiro-provider sub-site on pull requests that touch it, without deploying. The content
# checks (both languages, registered components, word lists) run in kiro-provider before a sync
# lands here; this catches changes to the site itself: config, theme, components, lockfile,
# and the deploy steps that publish it under /kiro-provider/.

on:
  pull_request:
    branches: [main]
    paths:
      - 'kiro-provider/**'
      - '.github/workflows/kiro-provider-site-ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: kiro-provider-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the kiro-provider site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: kiro-provider/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: kiro-provider/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: kiro-provider
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: kiro-provider
        run: pnpm build

      - name: Check both languages, the links and the /kiro-provider/ base
        working-directory: kiro-provider
        run: ./scripts/check-dist.sh dist
