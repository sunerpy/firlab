name: bedrock-gateway site CI

# Builds the bedrock-gateway sub-site on pull requests that touch it, without deploying. The content
# checks (both languages, registered components, word lists) run in bedrock-gateway-rust before a
# sync lands here; this catches changes to the site itself: config, theme, components, lockfile,
# and the deploy steps that publish it under /bedrock-gateway/.

on:
  pull_request:
    branches: [main]
    paths:
      - 'bedrock-gateway/**'
      - '.github/workflows/bedrock-gateway-site-ci.yml'
      - '.github/workflows/deploy.yml'

concurrency:
  group: bedrock-gateway-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the bedrock-gateway site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: bedrock-gateway/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: bedrock-gateway/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: bedrock-gateway
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: bedrock-gateway
        run: pnpm build

      - name: Check both languages, the links and the /bedrock-gateway/ base
        working-directory: bedrock-gateway
        run: ./scripts/check-dist.sh dist
