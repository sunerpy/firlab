name: One-off create Pages project
on:
  workflow_dispatch: {}
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create zuno-docs Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          resp=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"zuno-docs","production_branch":"main"}')
          echo "$resp" | python3 -c "
import sys,json
d=json.load(sys.stdin)
print('success:', d.get('success'))
if d.get('success'):
    r=d['result']; print('name:', r['name']); print('subdomain:', r.get('subdomain'))
else:
    print('errors:', json.dumps(d.get('errors'))[:400])
    raise SystemExit(1)
"
