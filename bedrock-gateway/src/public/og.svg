<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="bedrock-gateway — Amazon Bedrock behind the OpenAI APIs. Chat Completions, Responses and Embeddings, from your own AWS account.">
  <title>bedrock-gateway — Amazon Bedrock behind the OpenAI APIs</title>
  <!-- The source of og.png (1200 × 630, rendered in Chrome; bedrock-gateway/README.md). The colours
       are the site's light theme (theme/styles/tokens.css); the terminal lines are the first
       request of the home page's recorded session and its real output. -->

  <!-- Ground -->
  <rect width="1200" height="630" fill="#F3F6FA"/>

  <!-- Accent hairline, top edge: the mark's teal, it never carries text -->
  <rect x="0" y="0" width="1200" height="6" fill="#14B8A6"/>

  <!-- The mark (bedrock-gateway-logo.svg at 60 px) and the name -->
  <g transform="translate(88, 76)">
    <svg width="60" height="60" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="22" fill="#0B1220"/>
      <path d="M18 31 H30 C42 31 42 50 54 50 M18 69 H30 C42 69 42 50 54 50" fill="none" stroke="#E7EDF5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 46 H62 V54 H50 Z" fill="#E7EDF5"/>
      <path d="M62 46 H82 A4 4 0 0 1 82 54 H62 Z" fill="#14B8A6"/>
      <path d="M62 24 V38 M62 62 V76" stroke="#E7EDF5" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <text x="80" y="43"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="40" font-weight="650" letter-spacing="-0.6" fill="#0B1220">bedrock-gateway</text>
  </g>

  <!-- Address line, level with the name -->
  <text x="1112" y="119" text-anchor="end"
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Consolas, monospace"
    font-size="22" fill="#5B6779">firlab.app/bedrock-gateway</text>

  <!-- Headline: the hero's text; below it what the gateway serves -->
  <text
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="62" font-weight="700" letter-spacing="-1.2" fill="#0B1220">
    <tspan x="84" y="230">Amazon Bedrock behind</tspan>
    <tspan x="84" y="302">the OpenAI APIs</tspan>
  </text>

  <text x="88" y="356"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="26" font-weight="400" fill="#475569">Chat Completions, Responses and Embeddings, from your own AWS account.</text>

  <!-- The first request of the recorded session, framed by a hairline -->
  <rect x="88" y="386" width="1024" height="204" rx="12" fill="#FBFCFE"/>
  <rect x="88.5" y="386.5" width="1023" height="203" rx="11.5" fill="none" stroke="#DCE4EE"/>
  <text
    font-family="'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, Consolas, monospace"
    font-size="19" fill="#0B1220" xml:space="preserve">
    <tspan x="116" y="424"><tspan fill="#5B6779">$ </tspan>curl -s $BGW/chat/completions -H "Authorization: Bearer $API_KEY" --json '{</tspan>
    <tspan x="116" y="451">      "model": "us.amazon.nova-2-lite-v1:0",</tspan>
    <tspan x="116" y="478">      "messages": [{"role": "user",</tspan>
    <tspan x="116" y="505">        "content": "Reply with exactly: BEDROCK_OK"}]}' |</tspan>
    <tspan x="116" y="532">    jq -r '.choices[0].message.content'</tspan>
    <tspan x="116" y="566" fill="#334155">BEDROCK_OK</tspan>
  </text>
</svg>
