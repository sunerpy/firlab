<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="FirLab — 开源的桌面应用、命令行工具与自部署服务">
  <title>FirLab — 开源的桌面应用、命令行工具与自部署服务</title>
  <!-- Source of public/og.png, which is a 1200×630 render of this file. It names no
       product on purpose: a card that lists the apps goes stale the day one is added. -->

  <!-- Ground: the app icons' navy -->
  <rect width="1200" height="630" fill="#0B1220"/>

  <!-- Accent hairline, top edge -->
  <rect x="0" y="0" width="1200" height="6" fill="#F97316"/>

  <!-- The bracket glyph at display size, top right. Solid tints of #F2F6FB on the
       navy (16% and 9%) rather than opacity, so the strokes do not brighten where
       they cross; the spine is drawn after the faint arm and before the orange one. -->
  <g transform="translate(934, 112)" stroke-linecap="square">
    <path d="M10 170 L76 170" stroke="#202634" stroke-width="28"/>
    <path d="M10 98 L128 98" stroke="#303643" stroke-width="28"/>
    <path d="M10 0 L10 196" stroke="#303643" stroke-width="28"/>
    <path d="M10 26 L178 26" stroke="#F97316" stroke-width="28"/>
  </g>

  <!-- Brand line -->
  <text x="82" y="282"
    font-family="system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="136" font-weight="700" letter-spacing="-3" fill="#F2F6FB">FirLab</text>

  <!-- What it offers, in both languages -->
  <text x="88" y="386"
    font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif"
    font-size="44" font-weight="600" fill="#DDE5F0">开源的桌面应用、命令行工具与自部署服务</text>
  <text x="88" y="440"
    font-family="system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="26" fill="#8D9BB0">Open-source desktop apps, command-line tools and self-hosted services</text>

  <!-- Rule and address line -->
  <rect x="88" y="512" width="1024" height="1" fill="#1F2A38"/>
  <text x="88" y="566"
    font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
    font-size="22" font-weight="600" fill="#F97316" letter-spacing="2.2">FIRLAB.APP</text>
</svg>
