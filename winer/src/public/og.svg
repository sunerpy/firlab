<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="winer：英雄联盟客户端助手。选人时看清每位队友的近期战绩和档位，翻完任何人的战绩，把接受对局、选用英雄和开局喊话交给它。">
  <title>winer：英雄联盟客户端助手</title>
  <!-- The source of og.png (1200 × 630; winer/README.md). The colours are the site's light theme
       (theme/styles/tokens.css); the capture is the home page's hero, the window's demo client. -->
  <defs>
    <clipPath id="desk">
      <rect x="560" y="150" width="560" height="350" rx="12"/>
    </clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0B1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#F3F6FA"/>

  <!-- Accent hairline, top edge: the brand gold marks, it never carries text -->
  <rect x="0" y="0" width="1200" height="6" fill="#E3BD66"/>

  <!-- The mark (scripts/brand/icons.py in winer, the 48 px drawing) and the name -->
  <g transform="translate(88, 96) scale(0.1171875)"><rect width="512" height="512" rx="112" fill="#0f1a26"/><path d="M256.0,51.0 L433.5,153.5 L433.5,358.5 L256.0,461.0 L78.5,358.5 L78.5,153.5 Z" fill="#e3bd66"/><path d="M134.5,213.3 L198.2,401.3 L256.0,308.7 L313.8,401.3 L377.5,213.3 L322.5,194.7 L298.2,266.7 L256.0,199.3 L213.8,266.7 L189.5,194.7 Z" fill="#0f1a26"/></g>
  <text x="164" y="140" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="40" font-weight="700" fill="#0B1220">winer</text>

  <!-- Headline and line -->
  <text x="88" y="262" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="50" font-weight="700" fill="#0B1220">英雄联盟</text>
  <text x="88" y="326" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="50" font-weight="700" fill="#0B1220">客户端助手</text>
  <text font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="22" fill="#475569">
    <tspan x="88" y="392">队友战绩与档位、完整战绩、</tspan>
    <tspan x="88" y="426">开局喊话与自动化</tspan>
  </text>
  <text x="88" y="520" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="20" fill="#5B6779">firlab.app/winer</text>

  <!-- The capture, framed by a hairline -->
  <g filter="url(#drop)">
    <rect x="560" y="150" width="560" height="350" rx="12" fill="#FFFFFF"/>
  </g>
  <image x="560" y="150" width="560" height="350" preserveAspectRatio="xMidYMid slice" clip-path="url(#desk)" xlink:href="screens/live-light.webp"/>
  <rect x="560.5" y="150.5" width="559" height="349" rx="12" fill="none" stroke="#DCE4EE"/>
</svg>
